<style>
:root{--nav:#10294f;--nav2:#0b2142;--bg:#f3f6fc;--panel:#fff;--ink:#17243a;--muted:#6c7890;--line:#e4eaf4;--blue:#1264e8;--green:#0aa75b;--purple:#8b35dc;--orange:#f28b12;--shadow:0 3px 12px #17345c12}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:linear-gradient(160deg,var(--nav),var(--nav2));color:#fff;z-index:8;overflow:auto;display:flex;flex-direction:column}.logo{padding:18px 18px 16px;border-bottom:1px solid #ffffff20}.logo .mark{height:58px;background:#fff;color:#1260bf;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;letter-spacing:-1px}.logo h2{font-size:22px;margin:12px 0 1px}.logo p{margin:0;color:#d5e3f8}.nav{padding:12px 9px;flex:1}.nav button{width:100%;border:0;background:transparent;color:#eaf2ff;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;display:flex;align-items:center;gap:11px;font-size:14px}.nav button .ico{width:22px;text-align:center;font-size:18px}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#1474f5,#0753d7);box-shadow:0 3px 9px #001b4c55}.nav .sub{padding-left:42px;font-size:13px}.sidebar-foot{padding:10px 18px 16px;color:#d7e5f8;font-size:12px}.online{display:inline-flex;align-items:center;gap:7px;background:#087c43;padding:5px 12px;border-radius:20px;color:#fff;margin-bottom:8px}.online i{width:8px;height:8px;border-radius:50%;background:#55ff9c}.main{margin-left:252px;min-height:100vh}.topbar{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:15px;position:sticky;top:0;z-index:5}.hamb{border:0;background:transparent;font-size:25px;color:var(--ink)}.welcome{background:#dff9e8;color:#116333;border-radius:30px;padding:8px 15px;font-weight:700}.topspace{flex:1}.topbtn{border:0;background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 12px}.profile{display:flex;align-items:center;gap:10px;font-weight:700}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f5c9ad,#c6ddff);display:grid;place-items:center;font-size:20px}.content{padding:16px 18px 30px;max-width:1800px;margin:auto}.banner{height:150px;border-radius:15px;overflow:hidden;background:linear-gradient(110deg,#0874dc,#034bb8 55%,#052f83);color:white;display:flex;align-items:center;justify-content:space-between;padding:18px 30px;position:relative;box-shadow:var(--shadow);margin-bottom:15px}.banner:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 100%,#53b5ff77,transparent 32%),linear-gradient(0deg,#001b5433,transparent)}.banner>*{position:relative}.banner .digital{font-size:18px;font-weight:800;max-width:180px}.banner .center{text-align:center}.banner h1{font-size:clamp(28px,4vw,52px);margin:0;font-weight:900;font-style:italic;letter-spacing:-2px}.banner h1 span{color:#ffeb00}.banner h3{font-size:18px;margin:0;font-style:italic}.banner strong{display:inline-block;margin-top:9px;background:#ffe500;color:#09234b;padding:6px 18px;border-radius:30px;font-size:14px}.banner .csc{font-size:40px;font-weight:950;letter-spacing:2px}.banner .csc small{display:block;font-size:10px;letter-spacing:0;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:15px}.stat{border-radius:14px;color:white;padding:16px 17px;display:flex;align-items:center;gap:14px;min-height:94px;box-shadow:var(--shadow)}.stat .symbol{width:55px;height:55px;flex:0 0 55px;border-radius:50%;background:#ffffff30;display:grid;place-items:center;font-size:29px}.stat b{font-size:24px;display:block;line-height:1.15}.stat small{font-size:13px}.stat .trend{font-size:12px;margin-left:5px}.sblue{background:linear-gradient(115deg,#0874ed,#08b5e8)}.sgreen{background:linear-gradient(115deg,#00a64e,#13db68)}.spurple{background:linear-gradient(115deg,#8c30dd,#bb5ee9)}.sorange{background:linear-gradient(115deg,#f0780b,#ffb000)}.dashboard-grid{display:grid;grid-template-columns:1.45fr 1.08fr .9fr;gap:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.panel-head h3{margin:0;font-size:16px}.panel-head select{width:auto;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.chart{width:100%;height:190px}.quick-services{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.service-tile{border-radius:10px;padding:13px 5px;text-align:center;text-decoration:none;color:var(--ink);font-weight:700;min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.service-tile .big{font-size:25px}.tile1{background:#e2efff}.tile2{background:#e3f8e7}.tile3{background:#f3e6ff}.tile4{background:#e1f7f1}.tile5{background:#fff0df}.tile6{background:#e5f1ff}.recent{display:flex;flex-direction:column}.recent-item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.recent-item:last-child{border:0}.status-icon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:white;background:#16ae64;flex:0 0 26px}.status-icon.info{background:#1799dc}.recent-item b{display:block;font-size:13px}.recent-item small{color:var(--muted)}.amount{margin-left:auto;color:#0a9b50;font-weight:800;white-space:nowrap}.lower-grid{display:grid;grid-template-columns:1.15fr 1.15fr .9fr;gap:13px;margin-top:13px}.balance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.balance{border-radius:10px;padding:12px 5px;text-align:center;background:#e5efff;color:#143a75}.balance:nth-child(2){background:#e0f6e8;color:#08703d}.balance:nth-child(3){background:#f4e8ff;color:#6923a5}.balance .big{font-size:23px}.balance b{display:block;font-size:17px}.balance small{font-weight:650}.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick-actions button{border:0;border-radius:10px;color:white;padding:12px 5px;font-weight:700;min-height:90px}.quick-actions .big{display:block;font-size:23px;margin-bottom:6px}.qa1{background:linear-gradient(140deg,#7ce74c,#1cae45)}.qa2{background:linear-gradient(140deg,#2ac6ec,#0873d9)}.qa3{background:linear-gradient(140deg,#d052ee,#8c20cb)}.qa4{background:linear-gradient(140deg,#ffc22f,#f08a08)}.mode-row{display:flex;gap:6px}.mode-row button{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 4px;background:var(--bg);color:var(--ink);font-weight:700}.backupbtn{width:100%;margin-top:8px;border:0;border-radius:8px;padding:10px;color:white;background:linear-gradient(90deg,#a337ed,#7430dc);font-weight:700}.footer{margin:18px -18px -30px;background:var(--panel);border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:650}.footer em{color:#155ac4}.page-title{font-size:24px;margin:4px 0 3px}.muted{color:var(--muted)}.section{margin-top:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.btn{border:0;border-radius:8px;padding:10px 14px;background:#1264e8;color:#fff;font-weight:700}.btn.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#ffe6e8;color:#a52a39}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.service-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.service-link{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.service-link b{display:block;margin-bottom:5px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.empty{padding:20px;text-align:center;color:var(--muted)}
@media(max-width:1200px){.dashboard-grid{grid-template-columns:1.2fr 1fr}.dashboard-grid .recent-panel{grid-column:1/-1}.recent{display:grid;grid-template-columns:repeat(2,1fr);column-gap:16px}.lower-grid{grid-template-columns:1fr 1fr}.lower-grid .mode-panel{grid-column:1/-1}}
@media(max-width:850px){.sidebar{width:265px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.shade{display:none;position:fixed;inset:0;background:#0008;z-index:7}.shade.show{display:block}.main{margin-left:0}.hamb{display:block}.content{padding:12px}.topbar{height:60px;padding:0 12px}.banner{height:125px;padding:12px 15px}.banner .digital{font-size:13px;max-width:100px}.banner .csc{font-size:26px}.banner h3{font-size:13px}.banner strong{font-size:10px;padding:5px 9px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px;min-height:78px;gap:9px}.stat .symbol{width:42px;height:42px;flex-basis:42px;font-size:22px}.stat b{font-size:20px}.dashboard-grid{grid-template-columns:1fr}.dashboard-grid .recent-panel{grid-column:auto}.recent{display:flex}.lower-grid{grid-template-columns:1fr}.lower-grid .mode-panel{grid-column:auto}.profile .profile-name{display:none}.service-list{grid-template-columns:repeat(2,1fr)}.footer{margin:16px -12px -30px;font-size:12px}}
@media(max-width:430px){.welcome{padding:6px 9px;font-size:12px}.topbar{gap:8px}.topbtn{padding:8px}.banner .digital{display:none}.banner .csc{font-size:21px}.banner h1{font-size:29px}.banner h3{font-size:11px}.stats{gap:7px}.stat{padding:10px 8px}.stat b{font-size:18px}.stat small{font-size:11px}.quick-actions button{font-size:11px}.balance b{font-size:14px}.balance .big{font-size:19px}}
</style></head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="logo"><div class="mark">🇮🇳 CSC&nbsp; DIGITAL INDIA</div><h2>CSC Manage</h2><p>Digital Seva, Sabke Liye</p></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
<button data-page="services"><span class="ico">▦</span>CSC Services　⌄</button>
<button class="sub" data-page="services">◎ Aadhaar Services</button><button class="sub" data-page="services">▣ PAN Services</button><button class="sub" data-page="services">▤ EPFO Services</button><button class="sub" data-page="services">▥ Banking Services</button>
<button data-page="transactions"><span class="ico">⇄</span>Transactions　⌄</button><button data-page="reports"><span class="ico">▤</span>Reports　⌄</button><button data-page="diary"><span class="ico">▣</span>Daily Diary</button><button data-page="services"><span class="ico">↗</span>Website Links</button><button data-page="services"><span class="ico">★</span>Custom Menu</button><button data-page="settings"><span class="ico">⚙</span>Settings　⌄</button><button data-page="backup"><span class="ico">☁</span>Backup / Restore</button><button data-page="about"><span class="ico">ⓘ</span>About</button>
</nav><div class="sidebar-foot"><div class="online"><i></i> Online</div><br>Version: 2.0.0</div></aside>
<div class="shade" id="shade"></div>
<main class="main"><header class="topbar"><button class="hamb" id="hamb">☰</button><span class="welcome">🟢 Welcome Back!</span><span class="topspace"></span><button class="topbtn" onclick="toggleTheme()">☀️ / 🌙</button><button class="topbtn" title="Notifications">🔔</button><div class="profile"><span class="avatar">👤</span><span class="profile-name">CSC Operator<br><small class="muted">VLE</small></span></div></header>
<div class="content" id="view"></div><footer class="footer"><span>© 2026 CSC Manage. All Rights Reserved.</span><em>Digital India　•　Better Tomorrow</em><span>Powered by CSC</span></footer></main></div>
<script>
const KEY='cscManageData_v1',D={openingCash:0,openingBank:0,transactions:[],diary:[],services:[['Aadhaar Services','https://uidai.gov.in/'],['PAN Services','https://www.incometax.gov.in/'],['EPFO Services','https://www.epfindia.gov.in/'],['Banking Services','https://www.rbi.org.in/'],['DigiLocker','https://www.digilocker.gov.in/'],['UMANG Services','https://web.umang.gov.in/'],['Passport Seva','https://www.passportindia.gov.in/'],['Scholarships','https://scholarships.gov.in/'],['Other Services','https://www.india.gov.in/']]};
let data;try{data={...D,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data={...D}}let page='dashboard';
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function balances(){let c=+data.openingCash||0,b=+data.openingBank||0;data.transactions.forEach(x=>{let a=+x.amount||0;if(x.type==='Cash In'){if(x.mode==='Cash')c+=a;else b+=a}else if(['Withdraw','Expense'].includes(x.type)){if(x.mode==='Cash')c-=a;else b-=a}else if(x.type==='Transfer'){if(x.from==='Cash'){c-=a;b+=a}else{b-=a;c+=a}}});return{cash:c,bank:b,total:c+b}}
function go(p){page=p;$('sidebar').classList.remove('open');$('shade').classList.remove('show');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function table(items){if(!items.length)return '<div class="empty">No transactions recorded yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Transaction</th><th>Details</th><th>Account</th><th>Amount</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.note||'—')}</td><td>${esc(x.type==='Transfer'?x.from+' → '+(x.from==='Cash'?'Bank':'Cash'):x.mode)}</td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="delTxn('${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function render(){let v=$('view');if(page==='dashboard'){let t=balances(),today=new Date().toISOString().slice(0,10),todayTx=data.transactions.filter(x=>x.date===today),inToday=todayTx.filter(x=>x.type==='Cash In').reduce((s,x)=>s+ +x.amount,0);
let weekly=Array(7).fill(0);let labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-(6-i));let k=d.toISOString().slice(0,10);weekly[i]=data.transactions.filter(x=>x.date===k&&x.type==='Cash In').reduce((s,x)=>s+ +x.amount,0)}
let max=Math.max(100,...weekly),pts=weekly.map((x,i)=>`${35+i*85},${150-(x/max)*125}`).join(' '),dots=weekly.map((x,i)=>`<circle cx="${35+i*85}" cy="${150-(x/max)*125}" r="4" fill="#1264e8"/>`).join('');
v.innerHTML=`<div class="banner"><div class="digital">🇮🇳<br>Digital India<br><small>Power To Empower</small></div><div class="center"><h1>CSC <span>Manage</span></h1><h3>Digital Services Made Easy...</h3><strong>Empowering VLEs, Enabling Digital India</strong></div><div class="csc">CSC<small>COMMON SERVICE CENTRES</small></div></div>
<div class="stats"><div class="stat sblue"><div class="symbol">👥</div><div><b>${data.transactions.length.toLocaleString('en-IN')}</b><small>Total Transactions</small><span class="trend">↗ All records</span></div></div><div class="stat sgreen"><div class="symbol">₹</div><div><b>${money(data.transactions.filter(x=>x.type==='Cash In').reduce((s,x)=>s+ +x.amount,0))}</b><small>Total Earnings / Cash In</small><span class="trend">↗ Recorded</span></div></div><div class="stat spurple"><div class="symbol">▦</div><div><b>${todayTx.length}</b><small>Today's Transactions</small><span class="trend">↗ Today</span></div></div><div class="stat sorange"><div class="symbol">★</div><div><b>${data.diary.filter(x=>!x.done).length}</b><small>Pending Work</small><span class="trend">Daily Diary</span></div></div></div>
<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h3>📊 Transaction Overview</h3><select id="chartRange" onchange="render()"><option>Last 7 Days</option><option>Last 30 Days</option></select></div><svg class="chart" viewBox="0 0 620 205" preserveAspectRatio="none"><g stroke="var(--line)" stroke-dasharray="4 4"><path d="M40 25H610 M40 65H610 M40 105H610 M40 145H610 M40 185H610"/></g><g fill="var(--muted)" font-size="12"><text x="2" y="29">₹${Math.round(max).toLocaleString('en-IN')}</text><text x="8" y="69> </text><text x="8" y="109">₹${Math.round(max*.5).toLocaleString('en-IN')}</text><text x="18" y="189">₹0</text></g><polygon points="35,185 ${pts} 545,185" fill="#1264e8" opacity=".12"/><polyline points="${pts}" fill="none" stroke="#1264e8" stroke-width="3"/>${dots}<g fill="var(--ink)" font-size="12" text-anchor="middle">${labels.map((x,i)=>`<text x="${35+i*85}" y="202">${x}</text>`).join('')}</g></svg></section>
<section class="panel"><div class="panel-head"><h3>⚡ CSC Services Quick Access</h3></div><div class="quick-services">${[['◎','Aadhaar','tile1',0],['▣','PAN','tile2',1],['♣','EPFO','tile3',2],['▤','Banking','tile4',3],['▧','UMANG','tile5',5],['◎','Other','tile6',8]].map(a=>`<a class="service-tile ${a[2]}" href="${safe(data.services[a[3]]?.[1]||'#')}" target="_blank" rel="noopener"><span class="big">${a[0]}</span>${a[1]}<br>Services</a>`).join('')}</div></section>
<section class="panel recent-panel"><div class="panel-head"><h3>🕒 Recent Transactions</h3><button class="btn secondary" onclick="go('transactions')">View All →</button></div><div class="recent">${data.transactions.slice().reverse().slice(0,5).map(x=>`<div class="recent-item"><span class="status-icon ${x.type==='Cash In'?'':'info'}">${x.type==='Cash In'?'✓':'i'}</span><div><b>${esc(x.note||x.type)}</b><small>${esc(x.date)} · ${esc(x.type)}</small></div><span class="amount">${money(x.amount)}</span></div>`).join('')||'<div class="empty">No recent transactions</div>'}</div></section></div>
<div class="lower-grid"><section class="panel"><div class="panel-head"><h3>💳 Balance Summary</h3></div><div class="balance-grid"><div class="balance"><div class="big">▣</div><b>${money(t.cash)}</b><small>Cash Balance</small></div><div class="balance"><div class="big">▤</div><b>${money(t.bank)}</b><small>Bank Balance</small></div><div class="balance"><div class="big">₹</div><b>${money(t.total)}</b><small>Total Balance</small></div></div></section>
<section class="panel"><div class="panel-head"><h3>🚀 Quick Actions</h3></div><div class="quick-actions"><button class="qa1" onclick="newTxn('Cash In')"><span class="big">⊕</span>Add Balance</button><button class="qa2" onclick="newTxn('Withdraw')"><span class="big">▤</span>Withdraw</button><button class="qa3" onclick="newTxn('Transfer')"><span class="big">⇄</span>Transfer</button><button class="qa4" onclick="go('reports')"><span class="big">▧</span>Generate Report</button></div></section>
<section class="panel mode-panel"><div class="panel-head"><h3>⚙ Mode & Settings</h3></div><div class="mode-row"><button onclick="setTheme('light')">☀️ Light Mode</button><button onclick="setTheme('dark')">🌙 Dark Mode</button></div><button class="backupbtn" onclick="go('backup')">☁ Backup Data</button></section></div>`}
else if(page==='transactions'){v.innerHTML=`<h1 class="page-title">Transactions</h1><p class="muted">Manage cash received, withdrawals, transfers and expenses.</p><section class="panel section"><div class="row"><button class="btn" onclick="newTxn()">＋ Add Transaction</button><input id="search" placeholder="Search transactions..." oninput="filterTx()"><select id="filter" onchange="filterTx()"><option value="">All Types</option><option>Cash In</option><option>Withdraw</option><option>Transfer</option><option>Expense</option></select></div><div id="txTable" class="section">${table(data.transactions.slice().reverse())}</div></section>`}
else if(page==='diary'){v.innerHTML=`<h1 class="page-title">Daily Diary</h1><p class="muted">Track pending customer work and reminders.</p><section class="panel section"><div class="formgrid"><div class="field"><label>Work / Reminder</label><input id="task" placeholder="Enter work details"></div><div class="field"><label>Date</label><input id="taskDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Note</label><input id="taskNote" placeholder="Optional note"></div><button class="btn" onclick="addDiary()">Add to Diary</button></section><section class="panel section">${data.diary.slice().reverse().map((x,i)=>`<div class="row" style="padding:10px;border-bottom:1px solid var(--line)"><div><b>${esc(x.task)}</b><div class="muted">${esc(x.date)} · ${esc(x.note||'')}</div></div><button class="btn secondary" onclick="toggleDiary(${data.diary.length-1-i})">${x.done?'Undo':'Done'}</button><button class="btn danger" onclick="delDiary(${data.diary.length-1-i})">Delete</button></div>`).join('')||'<div class="empty">No diary entries yet.</div>'}</section>`}
else if(page==='services'){v.innerHTML=`<h1 class="page-title">CSC Services & Website Links</h1><p class="muted">Tap a website box to open its official portal.</p><div class="service-list section">${data.services.map(s=>`<a class="service-link" href="${safe(s[1])}" target="_blank" rel="noopener"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></a>`).join('')}</div><section class="panel section"><h3>Add Custom Website</h3><div class="formgrid"><div class="field"><label>Service Name</label><input id="svcName" placeholder="Service name"></div><div class="field"><label>Website URL</label><input id="svcUrl" placeholder="https://..."></div></div><button class="btn" onclick="addService()">Add Website</button></section>`}
else if(page==='reports'){v.innerHTML=`<h1 class="page-title">Reports</h1><p class="muted">View and export transactions for a selected period.</p><section class="panel section"><div class="formgrid"><div class="field"><label>From Date</label><input type="date" id="from"></div><div class="field"><label>To Date</label><input type="date" id="to"></div></div><div class="row"><button class="btn" onclick="report()">View Report</button><button class="btn secondary" onclick="printReport()">Print / Save PDF</button><button class="btn secondary" onclick="csv()">Export CSV</button></div><div id="reportOut" class="section muted">Choose dates to view your report.</div></section>`}
else if(page==='backup'){v.innerHTML=`<h1 class="page-title">Backup / Restore</h1><section class="panel section"><h3>Download Backup</h3><p class="muted">Save your records as a JSON backup file.</p><button class="btn" onclick="backup()">Download Backup</button></section><section class="panel section"><h3>Restore Backup</h3><p class="muted">Restoring replaces the current records.</p><input type="file" id="restoreFile" accept=".json,application/json"><button class="btn section" onclick="restore()">Restore Data</button></section>`}
else if(page==='settings'){let b=balances();v.innerHTML=`<h1 class="page-title">Settings</h1><section class="panel section"><h3>Opening Balances</h3><div class="formgrid"><div class="field"><label>Opening Cash (₹)</label><input id="openCash" type="number" value="${+data.openingCash||0}"></div><div class="field"><label>Opening Bank (₹)</label><input id="openBank" type="number" value="${+data.openingBank||0}"></div></div><button class="btn" onclick="saveBalances()">Save Settings</button></section><section class="panel section"><h3>Data & Privacy</h3><p class="muted">Your app records are stored locally in this browser. They are not encrypted or synced online. Browser data clearing may erase records. Do not enter Aadhaar numbers, OTPs, passwords, bank PINs or sensitive customer information.</p><button class="btn danger" onclick="clearData()">Delete All App Data</button></section>`}
else {v.innerHTML=`<h1 class="page-title">About CSC Manage</h1><section class="panel section"><h3>CSC Manage · Version 2.0.0</h3><p class="muted">Offline-first bookkeeping and service shortcut dashboard for CSC operators. This app is an independent record-keeping tool and is not an official government portal.</p></section>`}}
function newTxn(type='Cash In'){let box=document.createElement('div');box.style.cssText='position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:14px';box.innerHTML=`<section class="panel" style="width:min(440px,100%);max-height:90vh;overflow:auto"><div class="row"><h3>Add Transaction</h3><button class="btn secondary" onclick="this.closest('[style*=fixed]').remove()">Close</button></div><div class="field"><label>Type</label><select id="mt"><option ${type==='Cash In'?'selected':''}>Cash In</option><option ${type==='Withdraw'?'selected':''}>Withdraw</option><option ${type==='Transfer'?'selected':''}>Transfer</option><option ${type==='Expense'?'selected':''}>Expense</option></select></div><div class="field"><label>Amount (₹)</label><input id="ma" type="number" min=".01" step=".01"></div><div class="field" id="mf"><label>Account</label><select id="mm"><option>Cash</option><option>Bank</option></select></div><div class="field" id="ff" style="display:none"><label>Transfer From</label><select id="mfrom"><option>Cash</option><option>Bank</option></select></div><div class="field"><label>Date</label><input id="md" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Details / Note</label><input id="mn"></div><button class="btn" id="msave">Save Transaction</button></section>`;document.body.append(box);box.querySelector('#mt').onchange=e=>{box.querySelector('#mf').style.display=e.target.value==='Transfer'?'none':'block';box.querySelector('#ff').style.display=e.target.value==='Transfer'?'block':'none'};box.querySelector('#msave').onclick=()=>{let a=+box.querySelector('#ma').value;if(!(a>0))return alert('Enter a valid amount.');let ty=box.querySelector('#mt').value,from=box.querySelector('#mfrom').value,mode=box.querySelector('#mm').value,bal=balances(),avail=ty==='Transfer'?(from==='Cash'?bal.cash:bal.bank):(mode==='Cash'?bal.cash:bal.bank);if(['Withdraw','Expense','Transfer'].includes(ty)&&a>avail&&!confirm('Amount is greater than available balance. Save anyway?'))return;data.transactions.push({id:Date.now().toString(),type:ty,amount:a,mode,from,date:box.querySelector('#md').value,note:box.querySelector('#mn').value});save();box.remove();render()}}
function filterTx(){let q=$('search').value.toLowerCase(),f=$('filter').value;let a=data.transactions.slice().reverse().filter(x=>(!f||x.type===f)&&(`${x.type} ${x.note} ${x.date}`).toLowerCase().includes(q));$('txTable').innerHTML=table(a)}
function delTxn(id){if(confirm('Delete this transaction?')){data.transactions=data.transactions.filter(x=>x.id!==id);save();render()}}
function addDiary(){let task=$('task').value.trim();if(!task)return alert('Enter work details.');data.diary.push({task,date:$('taskDate').value,note:$('taskNote').value,done:false});save();render()}
function toggleDiary(i){data.diary[i].done=!data.diary[i].done;save();render()}function delDiary(i){data.diary.splice(i,1);save();render()}
function safe(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}
function addService(){let n=$('svcName').value.trim(),u=safe($('svcUrl').value.trim());if(!n||u==='#')return alert('Enter service name and a valid website URL.');data.services.push([n,u]);save();render()}
function saveBalances(){data.openingCash=+$('openCash').value||0;data.openingBank=+$('openBank').value||0;save();alert('Opening balances saved.')}
function report(){let f=$('from').value,t=$('to').value;if(!f||!t||f>t)return alert('Select a valid date range.');let a=data.transactions.filter(x=>x.date>=f&&x.date<=t),sum=k=>a.filter(x=>x.type===k).reduce((s,x)=>s+ +x.amount,0);$('reportOut').innerHTML=`<h3>Report: ${esc(f)} to ${esc(t)}</h3><p>Transactions: ${a.length}</p><p>Cash In: <b>${money(sum('Cash In'))}</b></p><p>Withdrawals: <b>${money(sum('Withdraw'))}</b></p><p>Expenses: <b>${money(sum('Expense'))}</b></p><p>Transfers: <b>${money(sum('Transfer'))}</b></p>${table(a)}`}
function printReport(){report();if(!$('from').value||!$('to').value)return;let w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print.');w.document.write('<html><head><title>CSC Manage Report</title><style>body{font:14px Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}</style></head><body><h1>CSC Manage Report</h1>'+ $('reportOut').innerHTML+'</body></html>');w.document.close();w.print()}
function csv(){let f=$('from').value,t=$('to').value;if(!f||!t||f>t)return alert('Select dates first.');let a=data.transactions.filter(x=>x.date>=f&&x.date<=t),rows=[['Date','Type','Amount','Account','Note'],...a.map(x=>[x.date,x.type,x.amount,x.type==='Transfer'?x.from+' transfer':x.mode,x.note||''])];let s=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+s],{type:'text/csv'}),`CSC-Manage-${f}-${t}.csv`)}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`CSC-Manage-Backup-${new Date().toISOString().slice(0,10)}.json`)}
function restore(){let f=$('restoreFile').files[0];if(!f)return alert('Choose a backup file.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.transactions)||!Array.isArray(x.diary)||!Array.isArray(x.services))throw 0;if(confirm('Replace current app data with backup?')){data={...D,...x};save();go('dashboard')}}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
function clearData(){if(confirm('Delete all app data? This cannot be undone.')){localStorage.removeItem(KEY);data={...D};save();go('dashboard')}}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('cscTheme',t)}function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
$('hamb').onclick=()=>{$('sidebar').classList.add('open');$('shade').classList.add('show')};$('shade').onclick=()=>{$('sidebar').classList.remove('open');$('shade').classList.remove('show')};$('nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)};setTheme(localStorage.getItem('cscTheme')||'light');render();
</script><link rel="manifest" href="./manifest.webmanifest"></body></html>
