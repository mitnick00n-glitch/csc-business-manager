<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>CSC Manage</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#687386;--line:#e5e9f0;--brand:#2457d6;--soft:#eaf0ff;--good:#13845b;--bad:#c33d4b;--shadow:0 5px 22px #14213b0d}
[data-theme=dark]{--bg:#0d1421;--panel:#151f30;--ink:#edf2fc;--muted:#a7b2c5;--line:#29364a;--brand:#86a8ff;--soft:#233252;--good:#54d5a2;--bad:#ff8290;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100dvh;display:flex}.sidebar{width:250px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.22s;overflow:auto}.sidebar.open{transform:translateX(0)}.shade{display:none;position:fixed;inset:0;background:#0007;z-index:4}.shade.show{display:block}.brand{font-size:20px;font-weight:800;padding:8px 10px 22px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}.nav button{display:flex;width:100%;border:0;background:transparent;color:var(--ink);padding:12px;border-radius:10px;text-align:left;margin:3px 0;gap:10px}.nav button.active,.nav button:hover{background:var(--soft);color:var(--brand)}.main{width:100%;min-width:0}.top{height:62px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:3}.top button{border:0;background:var(--soft);color:var(--ink);border-radius:9px;padding:9px 12px}.top strong{font-size:17px}.top .spacer{flex:1}.content{max-width:1100px;margin:auto;padding:18px 16px 44px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.welcome h1{font-size:23px;margin:0 0 3px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric .muted{font-size:13px}.metric b{display:block;font-size:23px;margin-top:8px;overflow-wrap:anywhere}.metric .tag{font-size:12px;color:var(--muted)}.section{margin-top:20px}.section h2{font-size:17px;margin:0 0 12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:14px 10px;text-align:left}.action span{display:block;font-weight:650;margin-top:7px}.action em{font-style:normal;font-size:21px}.panel{box-shadow:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{border:0;background:var(--brand);color:white;padding:10px 14px;border-radius:9px;font-weight:650}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.danger{background:#ffe9ec;color:#a92c3b}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:11px;min-width:0}textarea{min-height:78px;resize:vertical}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}.positive{color:var(--good)}.negative{color:var(--bad)}.hidden{display:none!important}.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel);color:var(--ink);text-decoration:none;display:block}.service b{display:block;margin-bottom:4px}.service small{color:var(--brand);overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:var(--soft);font-size:12px}.empty{padding:22px;text-align:center;color:var(--muted)}.footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
@media(min-width:850px){.sidebar{transform:none}.main{margin-left:250px}.top .menu{display:none}.shade{display:none!important}}
@media(max-width:650px){.content{padding:15px 12px 36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card,.panel{padding:13px}.metric b{font-size:20px}.actions{grid-template-columns:repeat(2,1fr)}.welcome h1{font-size:21px}.service-grid{grid-template-columns:1fr}.top{padding:0 12px}.welcome{align-items:flex-start}}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">CSC Manage<small>Offline business dashboard</small></div><nav class="nav" id="nav">
<button data-page="dashboard" class="active">⌂ &nbsp; Dashboard</button><button data-page="transactions">⇄ &nbsp; Transactions</button><button data-page="diary">▤ &nbsp; Daily Diary</button><button data-page="services">▦ &nbsp; CSC Services</button><button data-page="reports">▥ &nbsp; Reports</button><button data-page="backup">☁ &nbsp; Backup & Restore</button><button data-page="settings">⚙ &nbsp; Settings</button></nav></aside>
<div class="shade" id="shade"></div><main class="main"><header class="top"><button class="menu" id="menu">☰</button><strong id="pageTitle">Dashboard</strong><span class="spacer"></span><button id="themeBtn">☾ Theme</button></header><div class="content" id="view"></div></main></div>
<script>
const KEY='cscManageData_v1';
const defaults={openingCash:0,openingBank:0,transactions:[],diary:[],services:[
['Aadhaar / UIDAI','https://uidai.gov.in/'],['PAN Card / Income Tax','https://www.incometax.gov.in/'],['EPFO','https://www.epfindia.gov.in/'],['DigiLocker','https://www.digilocker.gov.in/'],['Passport Seva','https://www.passportindia.gov.in/'],['Scholarships','https://scholarships.gov.in/'],['Government Services','https://www.india.gov.in/']]};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data={...defaults}}
let page='dashboard';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const el=id=>document.getElementById(id);
function totals(){let cash=+data.openingCash||0,bank=+data.openingBank||0;data.transactions.forEach(t=>{let v=+t.amount||0;if(t.type==='Cash In'){if(t.mode==='Cash')cash+=v;else bank+=v}else if(t.type==='Withdraw'){if(t.mode==='Cash')cash-=v;else bank-=v}else if(t.type==='Expense'){if(t.mode==='Cash')cash-=v;else bank-=v}else if(t.type==='Transfer'){if(t.from==='Cash'){cash-=v;bank+=v}else{bank-=v;cash+=v}}});return{cash,bank,total:cash+bank}}
function go(p){page=p;el('sidebar').classList.remove('open');el('shade').classList.remove('show');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));el('pageTitle').textContent=({dashboard:'Dashboard',transactions:'Transactions',diary:'Daily Diary',services:'CSC Services',reports:'Reports',backup:'Backup & Restore',settings:'Settings'})[p];render()}
function render(){let v=el('view');if(page==='dashboard'){let t=totals(),today=new Date().toISOString().slice(0,10),day=data.transactions.filter(x=>x.date===today),inc=day.filter(x=>x.type==='Cash In').reduce((a,x)=>a+ +x.amount,0),out=day.filter(x=>['Withdraw','Expense'].includes(x.type)).reduce((a,x)=>a+ +x.amount,0);
v.innerHTML=`<div class="welcome"><div><h1>Good day 👋</h1><div class="muted">Your CSC business at a glance</div></div><span class="pill">${new Date().toLocaleDateString('en-IN')}</span></div><div class="grid"><div class="card metric"><div class="muted">Cash Balance</div><b>${money(t.cash)}</b><div class="tag">Available cash</div></div><div class="card metric"><div class="muted">Bank Balance</div><b>${money(t.bank)}</b><div class="tag">Available bank</div></div><div class="card metric"><div class="muted">Today's In</div><b class="positive">${money(inc)}</b><div class="tag">Cash received</div></div><div class="card metric"><div class="muted">Today's Out</div><b class="negative">${money(out)}</b><div class="tag">Withdrawals & expenses</div></div></div><section class="section"><h2>Quick Actions</h2><div class="actions"><button class="action" onclick="newTxn('Cash In')"><em>＋</em><span>Cash In</span></button><button class="action" onclick="newTxn('Withdraw')"><em>↘</em><span>Withdraw</span></button><button class="action" onclick="newTxn('Transfer')"><em>⇄</em><span>Transfer</span></button><button class="action" onclick="newTxn('Expense')"><em>−</em><span>Expense</span></button></div></section><section class="section"><h2>Recent Transactions</h2>${txnTable(data.transactions.slice().reverse().slice(0,6))}</section><section class="section"><h2>Pending / Daily Work</h2><div class="panel">${data.diary.filter(x=>!x.done).slice(0,4).map(x=>`<div>• ${esc(x.task)} <span class="muted small">(${esc(x.date)})</span></div>`).join('')||'<div class="muted">No pending work.</div>'}<button class="btn secondary" style="margin-top:12px" onclick="go('diary')">Open Daily Diary</button></div></section>`}
if(page==='transactions'){v.innerHTML=`<div class="welcome"><div><h1>Transactions</h1><div class="muted">Record money received, withdrawn, transferred or spent.</div></div><button class="btn" onclick="newTxn()">＋ Add</button></div><div class="panel"><div class="row"><div class="field"><label>Search</label><input id="txnSearch" placeholder="Search note or type" oninput="filterTxn()"></div><div class="field"><label>Type</label><select id="txnFilter" onchange="filterTxn()"><option value="">All types</option><option>Cash In</option><option>Withdraw</option><option>Transfer</option><option>Expense</option></select></div></div><div id="txnList">${txnTable(data.transactions.slice().reverse())}</div></div>`}
if(page==='diary'){v.innerHTML=`<div class="welcome"><div><h1>Daily Diary</h1><div class="muted">Keep track of pending work and reminders.</div></div></div><div class="panel"><div class="field"><label>Work / Reminder</label><input id="diaryTask" placeholder="e.g. Customer document follow-up"></div><div class="row"><div class="field"><label>Date</label><input type="date" id="diaryDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Note (optional)</label><input id="diaryNote" placeholder="Short note"></div></div><button class="btn" onclick="addDiary()">Add to Diary</button></div><section class="section"><h2>Work List</h2><div class="panel">${data.diary.slice().reverse().map((x,i)=>`<div class="row" style="border-bottom:1px solid var(--line);padding:10px 0"><div><b style="${x.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.task)}</b><div class="small muted">${esc(x.date)} · ${esc(x.note||'')}</div></div><button class="btn secondary" onclick="toggleDiary(${data.diary.length-1-i})">${x.done?'Undo':'Done'}</button><button class="btn danger" onclick="deleteDiary(${data.diary.length-1-i})">Delete</button></div>`).join('')||'<div class="empty">No diary items yet.</div>'}</div></section>`}
if(page==='services'){v.innerHTML=`<div class="welcome"><div><h1>CSC Services</h1><div class="muted">Official portal shortcuts. Tap a box to open the website.</div></div></div><div class="service-grid">${data.services.map((s,i)=>`<a class="service" href="${safeUrl(s[1])}" target="_blank" rel="noopener"><b>${esc(s[0])}</b><small>${esc(s[1])}</small></a>`).join('')}</div><section class="section panel"><h2>Add Custom Website</h2><div class="field"><label>Service name</label><input id="serviceName" placeholder="e.g. State service portal"></div><div class="field"><label>Website URL (https://)</label><input id="serviceUrl" placeholder="https://example.gov.in"></div><button class="btn" onclick="addService()">Add Website</button></section>`}
if(page==='reports'){v.innerHTML=`<div class="welcome"><div><h1>Reports</h1><div class="muted">Choose a date range to review and export records.</div></div></div><div class="panel"><div class="row"><div class="field"><label>From</label><input type="date" id="fromDate"></div><div class="field"><label>To</label><input type="date" id="toDate"></div></div><div class="row"><button class="btn" onclick="makeReport()">View Report</button><button class="btn secondary" onclick="printReport()">Print / Save PDF</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button></div><div id="reportResult" class="section muted">Select dates and tap View Report.</div></div>`}
if(page==='backup'){v.innerHTML=`<div class="welcome"><div><h1>Backup & Restore</h1><div class="muted">Keep a copy of your records somewhere safe.</div></div></div><div class="panel"><h2>Download Backup</h2><p class="muted">Save all transactions, diary items, services and opening balances as a JSON file.</p><button class="btn" onclick="backup()">Download Backup</button></div><section class="section panel"><h2>Restore Backup</h2><p class="muted">Choose a backup JSON file. Restoring replaces the current app data.</p><input type="file" id="restoreFile" accept=".json,application/json"><button class="btn" style="margin-top:12px" onclick="restore()">Restore Data</button></section>`}
if(page==='settings'){v.innerHTML=`<div class="welcome"><div><h1>Settings</h1><div class="muted">Opening balances and appearance.</div></div></div><div class="panel"><h2>Opening Balance</h2><div class="row"><div class="field"><label>Opening Cash (₹)</label><input id="openingCash" type="number" min="0" step=".01" value="${+data.openingCash||0}"></div><div class="field"><label>Opening Bank (₹)</label><input id="openingBank" type="number" min="0" step=".01" value="${+data.openingBank||0}"></div></div><button class="btn" onclick="saveSettings()">Save Balances</button></div><section class="section panel"><h2>Appearance</h2><p class="muted">Switch between light and dark mode.</p><button class="btn secondary" onclick="toggleTheme()">Toggle Theme</button></section><section class="section panel"><h2>Data & Privacy</h2><p class="muted">Data is stored in this browser on this device. It is not encrypted or synced online. Clearing browser site data may erase records. Do not enter Aadhaar numbers, OTPs, passwords, bank PINs or other sensitive customer information.</p><button class="btn danger" onclick="clearAll()">Delete All App Data</button></section>`}}
function txnTable(items){if(!items.length)return '<div class="empty">No transactions yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Details</th><th>Account</th><th>Amount</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.note||'—')}</td><td>${esc(x.type==='Transfer'?x.from+' → '+(x.from==='Cash'?'Bank':'Cash'):x.mode)}</td><td class="${x.type==='Cash In'?'positive':(['Withdraw','Expense'].includes(x.type)?'negative':'')}">${money(x.amount)}</td><td><button class="btn danger" onclick="deleteTxn('${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}
function newTxn(type='Cash In'){page='transactions';render();let t=type;let box=document.createElement('div');box.style.cssText='position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:14px';box.innerHTML=`<div class="panel" style="width:min(460px,100%);max-height:90dvh;overflow:auto"><div class="row"><h2 style="margin:0">Add Transaction</h2><button class="btn secondary" onclick="this.closest('[style*=fixed]').remove()">Close</button></div><div class="field"><label>Type</label><select id="mType"><option ${t==='Cash In'?'selected':''}>Cash In</option><option ${t==='Withdraw'?'selected':''}>Withdraw</option><option ${t==='Transfer'?'selected':''}>Transfer</option><option ${t==='Expense'?'selected':''}>Expense</option></select></div><div class="field"><label>Amount (₹)</label><input id="mAmount" type="number" min=".01" step=".01" placeholder="0.00"></div><div class="field" id="modeField"><label>Account</label><select id="mMode"><option>Cash</option><option>Bank</option></select></div><div class="field hidden" id="fromField"><label>Transfer from</label><select id="mFrom"><option>Cash</option><option>Bank</option></select></div><div class="field"><label>Date</label><input id="mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Note</label><input id="mNote" placeholder="Optional details"></div><button class="btn" id="saveTxn">Save Transaction</button></div>`;document.body.append(box);let typeSel=box.querySelector('#mType');function update(){let tr=typeSel.value==='Transfer';box.querySelector('#modeField').classList.toggle('hidden',tr);box.querySelector('#fromField').classList.toggle('hidden',!tr)}typeSel.onchange=update;update();box.querySelector('#saveTxn').onclick=()=>{let amount=+box.querySelector('#mAmount').value;if(!(amount>0)){alert('Please enter a valid amount.');return}let typ=typeSel.value,from=box.querySelector('#mFrom').value;if(typ==='Transfer'){let bal=totals();if((from==='Cash'?bal.cash:bal.bank)<amount){if(!confirm('Source balance is lower than transfer amount. Save anyway?'))return}}else{let mode=box.querySelector('#mMode').value,bal=totals(),available=mode==='Cash'?bal.cash:bal.bank;if(['Withdraw','Expense'].includes(typ)&&available<amount){if(!confirm('Available balance is lower than amount. Save anyway?'))return}}data.transactions.push({id:Date.now().toString(),type:typ,amount,mode:box.querySelector('#mMode').value,from,date:box.querySelector('#mDate').value,note:box.querySelector('#mNote').value});save();box.remove();render()}}
function filterTxn(){let q=(el('txnSearch')?.value||'').toLowerCase(),f=el('txnFilter')?.value||'';let a=data.transactions.slice().reverse().filter(x=>(!f||x.type===f)&&(`${x.note} ${x.type} ${x.date}`).toLowerCase().includes(q));el('txnList').innerHTML=txnTable(a)}
function deleteTxn(id){if(confirm('Delete this transaction?')){data.transactions=data.transactions.filter(x=>x.id!==id);save();render()}}
function addDiary(){let task=el('diaryTask').value.trim();if(!task)return alert('Enter work details.');data.diary.push({task,date:el('diaryDate').value,note:el('diaryNote').value,done:false});save();render()}
function toggleDiary(i){data.diary[i].done=!data.diary[i].done;save();render()}function deleteDiary(i){data.diary.splice(i,1);save();render()}
function safeUrl(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}
function addService(){let n=el('serviceName').value.trim(),u=safeUrl(el('serviceUrl').value.trim());if(!n||u==='#')return alert('Enter a name and valid http/https website URL.');data.services.push([n,u]);save();render()}
function saveSettings(){data.openingCash=+el('openingCash').value||0;data.openingBank=+el('openingBank').value||0;save();alert('Opening balances saved.');render()}
function makeReport(){let f=el('fromDate').value,t=el('toDate').value;if(!f||!t||f>t)return alert('Select a valid date range.');let a=data.transactions.filter(x=>x.date>=f&&x.date<=t),sum=type=>a.filter(x=>x.type===type).reduce((s,x)=>s+ +x.amount,0);el('reportResult').innerHTML=`<h2>Report: ${esc(f)} to ${esc(t)}</h2><p>Transactions: <b>${a.length}</b></p><p>Cash In: <b class="positive">${money(sum('Cash In'))}</b></p><p>Withdrawals: <b>${money(sum('Withdraw'))}</b></p><p>Expenses: <b class="negative">${money(sum('Expense'))}</b></p><p>Transfers: <b>${money(sum('Transfer'))}</b></p>${txnTable(a)}`}
function printReport(){if(!el('fromDate').value||!el('toDate').value){alert('Select dates first.');return}makeReport();let content=el('reportResult').innerHTML,w=window.open('','_blank');if(!w){alert('Allow pop-ups to print this report.');return}w.document.write(`<html><head><title>CSC Manage Report</title><style>body{font:14px Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>CSC Manage Report</h1>${content}</body></html>`);w.document.close();w.print()}
function exportCSV(){let f=el('fromDate').value,t=el('toDate').value;if(!f||!t||f>t)return alert('Select a valid date range.');let a=data.transactions.filter(x=>x.date>=f&&x.date<=t),rows=[['Date','Type','Amount','Account','Note'],...a.map(x=>[x.date,x.type,x.amount,x.type==='Transfer'?x.from+' transfer':x.mode,x.note||''])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`CSC-Manage-${f}-to-${t}.csv`)}
function backup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`CSC-Manage-Backup-${new Date().toISOString().slice(0,10)}.json`)}
function restore(){let file=el('restoreFile').files[0];if(!file)return alert('Choose a JSON backup file.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.transactions)||!Array.isArray(x.diary)||!Array.isArray(x.services))throw 0;if(confirm('Replace current data with this backup?')){data={...defaults,...x};save();go('dashboard');alert('Backup restored.')}}catch(e){alert('This backup file is not valid.')}};r.readAsText(file)}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function clearAll(){if(confirm('Delete all CSC Manage data from this browser? This cannot be undone.')){localStorage.removeItem(KEY);data={...defaults};save();go('dashboard')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleTheme(){let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.setItem('cscTheme',dark?'dark':'light')}
el('themeBtn').onclick=toggleTheme;el('menu').onclick=()=>{el('sidebar').classList.add('open');el('shade').classList.add('show')};el('shade').onclick=()=>{el('sidebar').classList.remove('open');el('shade').classList.remove('show')};el('nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)};document.documentElement.dataset.theme=localStorage.getItem('cscTheme')||'light';render();
</script></body></html>
